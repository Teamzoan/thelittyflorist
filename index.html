<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | The Litty Florist</title>
    <style>
        /* 1. LAYOUT - Centers the card perfectly on the screen */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9; /* Light grey background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. THE CARD CONTAINER */
        .construction-card {
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(108, 34, 124, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* 3. LOGO STYLES */
        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6c227c;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        /* 4. TEXT STYLES */
        h1 {
            color: #6c227c;
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        h2 {
            color: #d192da;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        p {
            color: #5a5a5a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* 5. INSTAGRAM BUTTON STYLES */
        .instagram-btn {
            display: inline-block;
            background-color: #6c227c;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0 25px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 34, 124, 0.2);
        }

        .instagram-btn:hover {
            background-color: #d192da;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(108, 34, 124, 0.3);
        }

        /* 6. VISUAL ELEMENTS */
        .divider {
            height: 3px;
            width: 50px;
            background-color: #6c227c;
            margin: 20px auto;
            border-radius: 2px;
        }

        /* 7. ANIMATIONS */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .footer-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="construction-card">
        <img src="logo.png" alt="The Litty Florist Logo" class="logo">
        
        <h2>Coming Soon</h2>
        <h1>The Litty Florist</h1>
        
        <div class="divider"></div>
        
        <p>Our digital garden is currently being planted. We're working hard to bring you the freshest arrangements.</p>

        <p>Follow our journey on Instagram:</p>
        <a href="https://www.instagram.com/thelittyflorist?igsh=MTI5cWdwazd4ZHRvYg%3D%3D" target="_blank" class="instagram-btn">
            @thelittyflorist
        </a>
        
        <p><strong>Check back shortly!</strong></p>

        <div class="footer-text">
            © 2026 The Litty Florist <br>
            Website Under Construction
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | The Litty Florist</title>
    <style>
        /* 1. LAYOUT */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. THE CARD */
        .construction-card {
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(108, 34, 124, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .logo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6c227c;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            color: #6c227c;
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        h2 {
            color: #d192da;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        p {
            color: #5a5a5a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* 3. BUTTONS SECTION */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
            align-items: center;
        }

        .btn {
            display: inline-block;
            width: 80%;
            padding: 14px 0;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .instagram-btn {
            background-color: #6c227c;
            color: white;
        }

        .email-btn {
            background-color: white;
            color: #6c227c;
            border: 2px solid #6c227c;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(108, 34, 124, 0.2);
            opacity: 0.9;
        }

        /* 4. ANIMATIONS & DIVIDER */
        .divider {
            height: 3px;
            width: 50px;
            background-color: #6c227c;
            margin: 20px auto;
            border-radius: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .footer-text {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="construction-card">
        <img src="logo.png" alt="The Litty Florist Logo" class="logo">
        
        <h2>Coming Soon</h2>
        <h1>The Litty Florist</h1>
        
        <div class="divider"></div>
        
        <p>Our digital garden is being planted. While we grow, stay in touch with us here:</p>

        <div class="button-group">
            <a href="https://www.instagram.com/thelittyflorist?igsh=MTI5cWdwazd4ZHRvYg%3D%3D" target="_blank" class="btn instagram-btn">
                Follow on Instagram
            </a>

            <a href="mailto:thelittyflorist@gmail.com?subject=Inquiry%20from%20Website" class="btn email-btn">
                Email Us
            </a>
        </div>
        
        <p><strong>Check back shortly!</strong></p>

        <div class="footer-text">
            © 2026 The Litty Florist <br>
            Website Under Construction
        </div>
    </div>

</body>
</html>
